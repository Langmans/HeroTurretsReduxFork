[mod-setting-description]
heroturrets-hide-ranked-from-ghost-cursor=Verhindert, dass Rangtürme im Geist-Cursor-Auswahlfeld bei Fernansicht/Radar erscheinen. Rangtürme werden weiterhin automatisch anhand von Kills/Schaden aufgewertet. (Standard: Aktiviert)
heroturrets-setting-level-up-modifier=Multipliziert die standardmäßig benötigten Kills/Schaden pro Rang. Formel ist #Benötigt = #FürRang + (#FürRang * Modifikator / 10). Kill-/Schaden-Rangwerte findest du auf der Modseite. (Standard ist 0)
heroturrets-setting-level-buff-modifier=Verändert die pro Rang gewährten Boni als Prozentsatz. (Ein Wert von 1 entspricht 1% mehr, 10 entspricht 10% mehr usw.) (Standard ist 0, Maximum 100)
heroturrets-kill-counter=Beeinflusst, wie Türme beim Abbauen behandelt werden. Fuzzy: Behält beim Aufheben die für den Rang benötigte Kill-Anzahl bei. | Exact: Verfolgt beim Aufheben die exakte Kill-Anzahl des Turms. Exact versieht Türme mit Tags, was zu vielen Stapeln im Inventar führen kann, da jeder Stapel eine andere Kill-Anzahl speichert. | Disabled: Türme behalten ihren Rang beim Abbauen nicht, ihre Kills werden als "0" gespeichert. Sie werden auf den Basisturm zurückgesetzt.
heroturrets-allow-artillery-turrets=Deaktiviert die Beförderung von Artillerietürmen. Bei Deaktivierung müssen alle bereits befördertem Artillerietürme aufgehoben und wieder platziert werden.
heroturrets-setting-ammo-turret-kill-multiplier=Fügt eine multiplikative Menge an benötigten Kills/Schaden pro Rang für Türme vom Typ "ammo-turret" hinzu. Formel ist (die Variable #Benötigt stammt aus der Rangmodifikator-Formel): #GesamtBenötigt = #Benötigt * Modifikator. (Min: 1, Max: 20)
heroturrets-setting-fluid-turret-kill-multiplier=Fügt eine multiplikative Menge an benötigten Kills/Schaden pro Rang für Türme vom Typ "fluid-turret" hinzu. Formel ist (die Variable #Benötigt stammt aus der Rangmodifikator-Formel): #GesamtBenötigt = #Benötigt * Modifikator. (Min: 1, Max: 20)
heroturrets-setting-electric-turret-kill-multiplier=Fügt eine multiplikative Menge an benötigten Kills/Schaden pro Rang für Türme vom Typ "electric-turret" hinzu. Formel ist (die Variable #Benötigt stammt aus der Rangmodifikator-Formel): #GesamtBenötigt = #Benötigt * Modifikator. (Min: 1, Max: 20)
heroturrets-setting-artillery-turret-kill-multiplier=Fügt eine multiplikative Menge an benötigten Kills/Schaden pro Rang für Türme vom Typ "artillery-turret" hinzu. Formel ist (die Variable #Benötigt stammt aus der Rangmodifikator-Formel): #GesamtBenötigt = #Benötigt * Modifikator. (Min: 1, Max: 20)
heroturrets-allow-damage=Erlaubt eine Beförderung basierend auf vom Turm ausgeteiltem Schaden
heroturrets-use-csv=Aktiviert oder deaktiviert eigene Namen
heroturrets-csv-names=Ermöglicht die Festlegung eigener Rangnamen, durch Kommas getrennt. Die Boni werden über die verfügbaren Optionen verteilt. Es wird nicht empfohlen, dies nach Spielstart zu ändern. Maximal 12 Namen, je maximal 25 Zeichen lang.
heroturrets-damage-counter=Behält Schadenstatistiken bei. Funktioniert nur, wenn Kill-Zähler auf Exact steht.
heroturrets-allow-ghost-rank=Lässt zerstörte Entitäten einen Rang-Entitätsgeist als Ersatz erwarten, andernfalls wird der Basis-Entitätsgeist platziert
heroturrets-allow-blueprint-rank=Bei Deaktivierung werden Rangtürme in Blaupausen und beim Kopieren-Einfügen durch Basistürme ersetzt. Bei Aktivierung bleiben Rangtürme in Blaupausen erhalten. (Standard: Deaktiviert)
heroturrets-announce-rank-up=Bei Aktivierung wirst du über Turmbeförderungen benachrichtigt. (Standard: Aktiviert)
heroturrets-announce-rank-up-mode=Wähle, ob die Benachrichtigung eine globale Meldung oder nur ein lokaler Turmton ist. Gilt nur, wenn Beförderungsbenachrichtigungen aktiviert sind. (Standard: Lokal)
heroturrets-announce-rank-up-sound=Spielt einen Ton ab, wenn ein Turm befördert wird. Gilt nur, wenn Beförderungsbenachrichtigungen aktiviert sind. (Standard: Aktiviert)
heroturrets-announce-rank-up-flash=Zeigt einen visuellen Blitztext, wenn ein Turm befördert wird. Gilt nur, wenn Beförderungsbenachrichtigungen aktiviert sind. (Standard: Aktiviert)
heroturrets-setting-run-in-updates=Türme werden standardmäßig in final fixes erzeugt, du kannst dies jedoch so ändern, dass Türme in data updates erzeugt werden. Empfohlen für die SearchLightAssault-Mod
heroturrets-use-csv-kills=Aktiviert oder deaktiviert eigene Kill-Werte.
heroturrets-csv-kill=Ermöglicht eigene Kill-Rangwerte. Müssen numerische Zahlen sein, jeder Wert durch ein Komma getrennt. Zahlen müssen im Format 10000 vorliegen. Keine Trennzeichen in den Zahlen verwenden. Maximalwert ist 4000000 (4 Millionen). Die Anzahl der Werte sollte der Anzahl der verfügbaren Ränge entsprechen. Standardmäßig sind das sechs, verwendest du aber auch Eigene Ränge, muss die Anzahl mit der Anzahl der dort angegebenen Namen übereinstimmen. Ist sie größer oder kleiner als die aktuelle Rangzahl, werden der erste und letzte vorhandene Wert verwendet, um eine Verteilung über alle Ränge zu erzeugen.
heroturrets-use-csv-damage=Aktiviert eigene Schaden-Rangwerte. Wird nur verwendet, wenn "Rang nach Schaden" ebenfalls aktiviert ist
heroturrets-csv-damage= Ermöglicht eigene Schaden-Rangwerte. Wird nur verwendet, wenn "Rang nach Schaden" ebenfalls aktiviert ist. Müssen numerische Zahlen sein, jeder Wert durch ein Komma getrennt. Zahlen müssen im Format 10000 vorliegen. Keine Trennzeichen in den Zahlen verwenden. Die Anzahl der Werte sollte der Anzahl der verfügbaren Ränge entsprechen. Standardmäßig sind das sechs, verwendest du aber auch Eigene Ränge, muss die Anzahl mit der Anzahl der dort angegebenen Namen übereinstimmen. Ist sie größer oder kleiner als die aktuelle Rangzahl, werden der erste und letzte vorhandene Wert verwendet, um eine Verteilung über alle Ränge zu erzeugen.
heroturrets-use-csv-buff=Eigenen Bonusprozentsatz für Ränge aktivieren
heroturrets-csv-buff= Ermöglicht eigene Bonusprozentsätze pro Rang. Müssen numerische Zahlen sein, jeder Wert durch ein Komma getrennt. Zahlen müssen im Format 100 vorliegen. Keine Trennzeichen oder "%"-Zeichen in den Zahlen verwenden. Ist die Anzahl größer oder kleiner als die aktuelle Rangzahl, wird der letzte vorhandene Wert verwendet, um eine Verteilung über alle Ränge zu erzeugen. (Empfohlen wird, 80 als höchsten Prozentsatz nicht zu überschreiten. Höhere Werte können das Spiel viel zu einfach machen, Türme oder dein Spiel beschädigen. Du wurdest gewarnt || Maximalwert: 999 ||)
heroturrets-use-csv-health-buff=Eigenen Prozentsatz für maximale Gesundheit pro Rang aktivieren, entspricht standardmäßig dem allgemeinen Bonus
heroturrets-csv-health-buff= Ermöglicht eigene Bonusprozentsätze pro Rang für maximale Gesundheit. Müssen numerische Zahlen sein, jeder Wert durch ein Komma getrennt. Zahlen müssen im Format 100 vorliegen. Keine Trennzeichen oder "%"-Zeichen in den Zahlen verwenden. Ist die Anzahl größer oder kleiner als die aktuelle Rangzahl, wird der letzte vorhandene Wert verwendet, um eine Verteilung über alle Ränge zu erzeugen. (Empfohlen wird, 80 als höchsten Prozentsatz nicht zu überschreiten. Höhere Werte können das Spiel viel zu einfach machen, Türme oder dein Spiel beschädigen. Du passt es an, wie du möchtest... Du wurdest gewarnt || Maximalwert: 999 ||)
heroturrets-use-csv-range-buff=Eigenen Reichweiten-Prozentsatz pro Rang aktivieren, entspricht standardmäßig dem allgemeinen Bonus
heroturrets-csv-range-buff= Ermöglicht eigene Bonusprozentsätze pro Rang für Reichweite. Müssen numerische Zahlen sein, jeder Wert durch ein Komma getrennt. Zahlen müssen im Format 100 vorliegen. Keine Trennzeichen oder "%"-Zeichen in den Zahlen verwenden. Ist die Anzahl größer oder kleiner als die aktuelle Rangzahl, wird der letzte vorhandene Wert verwendet, um eine Verteilung über alle Ränge zu erzeugen. (Empfohlen wird, 80 als höchsten Prozentsatz nicht zu überschreiten. Höhere Werte können das Spiel viel zu einfach machen, Türme oder dein Spiel beschädigen. Du passt es an, wie du möchtest... Du wurdest gewarnt || Maximalwert: 999 ||)
heroturrets-use-csv-firerate-buff=Eigenen Abklingzeit-Prozentsatz pro Rang aktivieren, entspricht standardmäßig dem allgemeinen Bonus
heroturrets-csv-firerate-buff= Ermöglicht eigene Bonusprozentsätze pro Rang für die Abklingzeit. Müssen numerische Zahlen sein, jeder Wert durch ein Komma getrennt. Zahlen müssen im Format 100 vorliegen. Keine Trennzeichen oder "%"-Zeichen in den Zahlen verwenden. Ist die Anzahl größer oder kleiner als die aktuelle Rangzahl, wird der letzte vorhandene Wert verwendet, um eine Verteilung über alle Ränge zu erzeugen. (Empfohlen wird, 80 als höchsten Prozentsatz nicht zu überschreiten. Höhere Werte können das Spiel viel zu einfach machen, Türme oder dein Spiel beschädigen. Du passt es an, wie du möchtest... Du wurdest gewarnt || Maximalwert: 999 ||)
heroturrets-use-csv-attack-speed-buff=Eigenen Angriffsgeschwindigkeits-Prozentsatz pro Rang aktivieren, entspricht standardmäßig dem allgemeinen Bonus
heroturrets-csv-attack-speed-buff= Ermöglicht eigene Bonusprozentsätze pro Rang für die Angriffsgeschwindigkeit. Beeinflusst, wie schnell die Angriffs- und Vorbereitungsanimationen ablaufen. Müssen numerische Zahlen sein, jeder Wert durch ein Komma getrennt. Zahlen müssen im Format 100 vorliegen. Keine Trennzeichen oder "%"-Zeichen in den Zahlen verwenden. Ist die Anzahl größer oder kleiner als die aktuelle Rangzahl, wird der letzte vorhandene Wert verwendet, um eine Verteilung über alle Ränge zu erzeugen. (Empfohlen wird, 80 als höchsten Prozentsatz nicht zu überschreiten. Höhere Werte können das Spiel viel zu einfach machen, Türme oder dein Spiel beschädigen. Du passt es an, wie du möchtest... Du wurdest gewarnt || Maximalwert: 999 ||)
heroturrets-use-csv-turret-rotation-buff=Eigenen Drehgeschwindigkeits-Prozentsatz pro Rang aktivieren, entspricht standardmäßig dem allgemeinen Bonus
heroturrets-csv-turret-rotation-buff=Ermöglicht eigene Bonusprozentsätze pro Rang für die Turmrotation. Beeinflusst, wie schnell sich der Turm vor einem Angriff auf ein neues Ziel drehen kann. Müssen numerische Zahlen sein, jeder Wert durch ein Komma getrennt. Zahlen müssen im Format 100 vorliegen. Keine Trennzeichen oder "%"-Zeichen in den Zahlen verwenden. Ist die Anzahl größer oder kleiner als die aktuelle Rangzahl, wird der letzte vorhandene Wert verwendet, um eine Verteilung über alle Ränge zu erzeugen. (Empfohlen wird, 80 als höchsten Prozentsatz nicht zu überschreiten. Höhere Werte können das Spiel viel zu einfach machen, Türme oder dein Spiel beschädigen. Du passt es an, wie du möchtest... Du wurdest gewarnt || Maximalwert: 999 ||)
heroturrets-max-health-on-rank=Gesundheit bei Beförderung auf Maximum setzen
heroturrets-update-ammo-ranges=Setzt die maximale Reichweite von Munitionsarten auf die maximale Reichweite der Türme, die sie verwenden. Dies kann ein Problem beheben, bei dem Raketen und andere Projektile bei höher befördertem Türmen vor Erreichen ihres Ziels explodieren. NUTZUNG AUF EIGENE GEFAHR, BEFINDET SICH IN ENTWICKLUNG
