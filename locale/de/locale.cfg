[heroturrets]
page_heroturrets_text_1=Deine Geschütztürme tragen geborgene, selbstlernende KI von deinem Schiff in sich. Je mehr sie kämpfen, desto tödlicher werden sie: Erreicht ein Turm genug Kills (oder wahlweise genug angerichteten Schaden), befördert er sich automatisch an Ort und Stelle selbst – ohne dass du irgendetwas neu bauen musst.
page_heroturrets_text_2=Nutze die Seiten links, um zu sehen, wie Ränge funktionieren, was jeder Rang bringt, was im Moment der Beförderung passiert, wie sich das Aufheben von Türmen auf ihren Rang auswirkt, und welche Türme unterstützt werden.

menu_ranks=Ränge & Beförderung
title_ranks=Ränge & Beförderung
page_ranks_text_1=Jeder Turm startet auf Rang 1 und kann standardmäßig sechs Ränge erklimmen: Gefreiter, Obergefreiter, Feldwebel, Hauptmann, Generalfeldmarschall und Oberbefehlshaber.
page_ranks_text_2=Standardmäßig basiert die Beförderung auf Kills: 150 / 1.000 / 2.500 / 5.000 / 10.000 / 20.000 Kills für Rang 1 bis 6. Wird die Einstellung "Rank by Damage" aktiviert, kann ein Turm zusätzlich befördert werden, sobald sein insgesamt angerichteter Schaden eine Rang-Schwelle überschreitet – das hilft Türmen, die viel Schaden anrichten, ohne immer den finalen Treffer zu landen.
page_ranks_text_3=Rangnamen, Kill-Schwellenwerte und Schaden-Schwellenwerte lassen sich alle in den Mod-Einstellungen anpassen, ebenso wie ein globaler Modifikator, der jede Schwelle hoch- oder herunterskaliert, sowie separate Multiplikatoren für Munitions-, Flüssigkeits-, Elektro- und Artillerietürme.

menu_bonuses=Rangboni
title_bonuses=Rangboni
page_bonuses_text_1=Jeder Rang bringt einen prozentualen Bonus, der standardmäßig von etwa 12% beim ersten Rang bis 60% beim höchsten Rang ansteigt. Sofern du keine eigenen Werte festlegst, gilt derselbe Prozentsatz gleichzeitig für angerichteten Schaden, maximale Gesundheit, Reichweite, Feuerrate und Dreh-/Zielgeschwindigkeit des Turms.
page_bonuses_text_2=Jeder dieser fünf Boni kann in den Mod-Einstellungen eine eigene, pro Rang anpassbare Kurve erhalten, und eine separate Einstellung "Rank Buff Modifier" skaliert jeden Bonus global hoch oder herunter.

menu_rankup=Beförderung
title_rankup=Beförderung
page_rankup_text_1=Eine Beförderung erfolgt sofort und an Ort und Stelle, in dem Moment, in dem ein Kill (oder Schaden) eines Turms eine Rang-Schwelle überschreitet. Es gibt keine Ausfallzeit und nichts, was von Hand neu gebaut werden müsste.
page_rankup_text_2=Der Turm wird durch seine höherrangige Version ersetzt, wobei geladene Munition, Flüssigkeit und gespeicherte Energie, aktuelle Gesundheit (sofern "Set Health to Max on Rank Up" nicht aktiviert ist), Kill-/Schadenzähler, die Prioritätsziel-Liste sowie alle Schaltkreis- oder Logistiknetzwerk-Verbindungen erhalten bleiben. Sind Beförderungsbenachrichtigungen in deinen persönlichen Einstellungen aktiviert, siehst du außerdem einen schwebenden Rangnamen und einen kurzen Lichtblitz über dem Turm, plus einen Sound oder eine anklickbare Meldung, je nach gewähltem Benachrichtigungsmodus.

menu_pickup=Aufheben von Rangtürmen
title_pickup=Aufheben von Rangtürmen
page_pickup_text_1=Was beim Abbauen mit dem Rang eines Turms geschieht, hängt von der Einstellung "Kill Counter" ab:
page_pickup_text_2_heading=Fuzzy (Standard)
page_pickup_text_2=Der Turm behält seinen Rang, aber sein Kill-Zähler wird auf genau die Menge zurückgesetzt, die für diesen Rang nötig ist, statt auf die tatsächliche Anzahl.
page_pickup_text_3=Der Turm behält seinen exakten Kill-Zähler (und, falls "Retain Damage Counter" ebenfalls aktiviert ist, auch den angerichteten Schaden), gespeichert als Tag am Gegenstand. Da jeder Gegenstand einen anderen exakten Wert tragen kann, kann dies dazu führen, dass du mehrere separate Stapel im Inventar hast statt einem.
page_pickup_text_4=Der Turm verliert seinen Rang vollständig und wird beim Aufheben zu einem gewöhnlichen Basisturm.
page_pickup_text_5_heading=Geister & Blaupausen
page_pickup_text_5=Zwei weitere Einstellungen steuern den Rang in diesen Fällen, beide standardmäßig deaktiviert: "Allow ranked ghosts" lässt Baubots einen zerstörten Turm in seinem ursprünglichen Rang statt von Grund auf neu bauen, und "Allow ranked turrets in blueprints/copy-paste" erhält den Rang eines Turms, wenn er als Blaupause gespeichert oder kopiert-eingefügt wird. Sind beide aus (Standard), fallen Türme in Geistern und Blaupausen auf ihre einfache Basisversion zurück.

menu_compatibility=Turm- & Mod-Kompatibilität
title_compatibility=Turm- & Mod-Kompatibilität
page_compatibility_text_1=Unterstützte Turmtypen: Munitions-, Flüssigkeits- (z. B. Flammenwerfer), Elektro- (z. B. Laser) und Artillerietürme, sowohl Vanilla als auch die meisten modifizierten Türme, einschließlich Space Age. Artillerietürme haben einen eigenen Ein/Aus-Schalter, da ihre Beförderung nicht die Fast-Replace-Funktion des Spiels nutzen kann; wird diese Einstellung deaktiviert, nachdem bereits welche befördert wurden, müssen diese Türme erneut aufgehoben und platziert werden, um zurückgesetzt zu werden.
page_compatibility_text_2=Bewusst nicht befördert: Wasser-/Dampftürme, fahrzeugmontierte Waffen, Schildkuppeln, Meteorabwehr aus Space Age sowie Türme im Kreativmodus. Yuoki Turrets wird als optionale Mod unterstützt. Ein paar weitere Turm-Mods mit bekannten Kompatibilitätsproblemen werden bewusst übersprungen, bis sie behoben sind.

