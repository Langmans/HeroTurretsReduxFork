[mod-setting-description]
heroturrets-hide-ranked-from-ghost-cursor=Empêche les tourelles graduées d'apparaître dans le panneau de sélection du curseur fantôme en vue à distance/radar. Les tourelles graduées continuent d'être promues automatiquement selon les éliminations/dégâts. (Défaut : Activé)
heroturrets-setting-level-up-modifier=Multiplie le nombre d'éliminations/dégâts requis par défaut par rang. La formule est #Requis = #PourRang + (#PourRang * Modificateur / 10). Les valeurs de rang par élimination/dégâts se trouvent sur la page du mod. (Défaut : 0)
heroturrets-setting-level-buff-modifier=Modifie les bonus appliqués par rang sous forme de pourcentage. (Une valeur de 1 correspond à une augmentation de 1%, 10 à une augmentation de 10%, etc.) (Défaut : 0, Maximum : 100)
heroturrets-kill-counter=Affecte la façon dont les tourelles sont traitées lors du déminage. Fuzzy : conserve le nombre d'éliminations requis pour le rang lorsque la tourelle est récupérée. | Exact : suit le nombre exact d'éliminations de la tourelle lors de la récupération. Exact fait que les tourelles portent des étiquettes, ce qui peut entraîner de nombreuses piles dans l'inventaire car chaque pile enregistre un nombre d'éliminations différent. | Disabled : les tourelles ne conservent pas leur rang lors du déminage, leurs éliminations étant enregistrées comme "0". Elles reviennent à la tourelle de base.
heroturrets-allow-artillery-turrets=Désactive la promotion des tourelles de type artillerie. Si désactivé, toutes les tourelles d'artillerie graduées devront être récupérées puis reposées.
heroturrets-setting-ammo-turret-kill-multiplier=Ajoute une quantité multiplicative d'éliminations/dégâts nécessaires par rang pour les tourelles de type "ammo-turret". Formule (la variable #Requis provient de la formule du modificateur de rang) : #TotalRequis = #Requis * Modificateur. (Min : 1, Max : 20)
heroturrets-setting-fluid-turret-kill-multiplier=Ajoute une quantité multiplicative d'éliminations/dégâts nécessaires par rang pour les tourelles de type "fluid-turret". Formule (la variable #Requis provient de la formule du modificateur de rang) : #TotalRequis = #Requis * Modificateur. (Min : 1, Max : 20)
heroturrets-setting-electric-turret-kill-multiplier=Ajoute une quantité multiplicative d'éliminations/dégâts nécessaires par rang pour les tourelles de type "electric-turret". Formule (la variable #Requis provient de la formule du modificateur de rang) : #TotalRequis = #Requis * Modificateur. (Min : 1, Max : 20)
heroturrets-setting-artillery-turret-kill-multiplier=Ajoute une quantité multiplicative d'éliminations/dégâts nécessaires par rang pour les tourelles de type "artillery-turret". Formule (la variable #Requis provient de la formule du modificateur de rang) : #TotalRequis = #Requis * Modificateur. (Min : 1, Max : 20)
heroturrets-allow-damage=Autorise la promotion en fonction des dégâts infligés par la tourelle
heroturrets-use-csv=Active ou désactive les noms personnalisés
heroturrets-csv-names=Permet de définir vos propres noms de rang, séparés par des virgules. Les bonus seront répartis sur les options disponibles. Il n'est pas conseillé de modifier ce paramètre après le début d'une partie. Maximum 12 noms, chacun de 25 caractères maximum.
heroturrets-damage-counter=Conserve les statistiques de dégâts. Ne fonctionne que si le compteur d'éliminations est réglé sur Exact.
heroturrets-allow-ghost-rank=Permet aux entités détruites d'attendre un fantôme d'entité gradué comme remplacement, sinon le fantôme d'entité de base est placé
heroturrets-allow-blueprint-rank=Si désactivé, les tourelles graduées dans les plans et le copier-coller sont remplacées par des tourelles de base. Si activé, les tourelles graduées sont conservées dans les plans. (Défaut : Désactivé)
heroturrets-announce-rank-up=Si activé, vous serez averti des promotions de tourelles. (Défaut : Activé)
heroturrets-announce-rank-up-mode=Choisissez si la notification est une alerte globale ou seulement un son local sur la tourelle. S'applique uniquement si les notifications de promotion sont activées. (Défaut : Local)
heroturrets-announce-rank-up-sound=Joue un son lorsqu'une tourelle est promue. S'applique uniquement si les notifications de promotion sont activées. (Défaut : Activé)
heroturrets-announce-rank-up-flash=Affiche un texte visuel clignotant lorsqu'une tourelle est promue. S'applique uniquement si les notifications de promotion sont activées. (Défaut : Activé)
heroturrets-setting-run-in-updates=Les tourelles sont générées par défaut dans final fixes, mais vous pouvez changer cela pour les générer dans data updates. Recommandé pour le mod SearchLightAssault
heroturrets-use-csv-kills=Active ou désactive les valeurs d'élimination personnalisées.
heroturrets-csv-kill=Permet de définir des valeurs de rang par élimination personnalisées. Doivent être des nombres numériques, chaque valeur séparée par une virgule. Les nombres doivent être au format 10000. N'incluez pas de séparateurs dans les nombres. Valeur maximale : 4000000 (4 millions). Le nombre de valeurs doit correspondre au nombre de rangs disponibles. Par défaut, il y en a six, mais si vous utilisez aussi les Rangs personnalisés, le nombre doit correspondre au nombre de noms que vous y avez définis. S'il y en a plus ou moins que le nombre de rangs actuel, les première et dernière valeurs présentes seront utilisées pour créer une répartition sur tous les rangs.
heroturrets-use-csv-damage=Active les valeurs de rang par dégâts personnalisées. Utilisé uniquement si "Rang par dégâts" est également activé
heroturrets-csv-damage= Permet de définir des valeurs de rang par dégâts personnalisées. Utilisé uniquement si "Rang par dégâts" est également activé. Doivent être des nombres numériques, chaque valeur séparée par une virgule. Les nombres doivent être au format 10000. N'incluez pas de séparateurs dans les nombres. Le nombre de valeurs doit correspondre au nombre de rangs disponibles. Par défaut, il y en a six, mais si vous utilisez aussi les Rangs personnalisés, le nombre doit correspondre au nombre de noms que vous y avez définis. S'il y en a plus ou moins que le nombre de rangs actuel, les première et dernière valeurs présentes seront utilisées pour créer une répartition sur tous les rangs.
heroturrets-use-csv-buff=Activer un pourcentage de bonus personnalisé par rang
heroturrets-csv-buff= Permet de définir des pourcentages de bonus personnalisés par rang. Doivent être des nombres numériques, chaque valeur séparée par une virgule. Les nombres doivent être au format 100. N'incluez pas de séparateurs ni de signes "%" dans les nombres. S'il y en a plus ou moins que le nombre de rangs actuel, la dernière valeur présente sera utilisée pour créer une répartition sur tous les rangs. (Il est recommandé de ne pas dépasser 80 comme pourcentage maximal. Des valeurs plus élevées peuvent rendre le jeu beaucoup trop facile, casser les tourelles ou casser votre partie. Vous êtes prévenu || Valeur maximale : 999 ||)
heroturrets-use-csv-health-buff=Activer un pourcentage de points de vie max personnalisé par rang, correspond par défaut au bonus général
heroturrets-csv-health-buff= Permet de définir des pourcentages de bonus personnalisés par rang pour les points de vie max. Doivent être des nombres numériques, chaque valeur séparée par une virgule. Les nombres doivent être au format 100. N'incluez pas de séparateurs ni de signes "%" dans les nombres. S'il y en a plus ou moins que le nombre de rangs actuel, la dernière valeur présente sera utilisée pour créer une répartition sur tous les rangs. (Il est recommandé de ne pas dépasser 80 comme pourcentage maximal. Des valeurs plus élevées peuvent rendre le jeu beaucoup trop facile, casser les tourelles ou casser votre partie. Personnalisez comme vous le souhaitez... Vous êtes prévenu || Valeur maximale : 999 ||)
heroturrets-use-csv-range-buff=Activer un pourcentage de portée personnalisé par rang, correspond par défaut au bonus général
heroturrets-csv-range-buff= Permet de définir des pourcentages de bonus personnalisés par rang pour la portée. Doivent être des nombres numériques, chaque valeur séparée par une virgule. Les nombres doivent être au format 100. N'incluez pas de séparateurs ni de signes "%" dans les nombres. S'il y en a plus ou moins que le nombre de rangs actuel, la dernière valeur présente sera utilisée pour créer une répartition sur tous les rangs. (Il est recommandé de ne pas dépasser 80 comme pourcentage maximal. Des valeurs plus élevées peuvent rendre le jeu beaucoup trop facile, casser les tourelles ou casser votre partie. Personnalisez comme vous le souhaitez... Vous êtes prévenu || Valeur maximale : 999 ||)
heroturrets-use-csv-firerate-buff=Activer un pourcentage de temps de rechargement personnalisé par rang, correspond par défaut au bonus général
heroturrets-csv-firerate-buff= Permet de définir des pourcentages de bonus personnalisés par rang pour le temps de rechargement. Doivent être des nombres numériques, chaque valeur séparée par une virgule. Les nombres doivent être au format 100. N'incluez pas de séparateurs ni de signes "%" dans les nombres. S'il y en a plus ou moins que le nombre de rangs actuel, la dernière valeur présente sera utilisée pour créer une répartition sur tous les rangs. (Il est recommandé de ne pas dépasser 80 comme pourcentage maximal. Des valeurs plus élevées peuvent rendre le jeu beaucoup trop facile, casser les tourelles ou casser votre partie. Personnalisez comme vous le souhaitez... Vous êtes prévenu || Valeur maximale : 999 ||)
heroturrets-use-csv-attack-speed-buff=Activer un pourcentage de vitesse d'attaque personnalisé par rang, correspond par défaut au bonus général
heroturrets-csv-attack-speed-buff= Permet de définir des pourcentages de bonus personnalisés par rang pour la vitesse d'attaque. Affecte la vitesse des animations d'attaque et de préparation. Doivent être des nombres numériques, chaque valeur séparée par une virgule. Les nombres doivent être au format 100. N'incluez pas de séparateurs ni de signes "%" dans les nombres. S'il y en a plus ou moins que le nombre de rangs actuel, la dernière valeur présente sera utilisée pour créer une répartition sur tous les rangs. (Il est recommandé de ne pas dépasser 80 comme pourcentage maximal. Des valeurs plus élevées peuvent rendre le jeu beaucoup trop facile, casser les tourelles ou casser votre partie. Personnalisez comme vous le souhaitez... Vous êtes prévenu || Valeur maximale : 999 ||)
heroturrets-use-csv-turret-rotation-buff=Activer un pourcentage de vitesse de rotation personnalisé par rang, correspond par défaut au bonus général
heroturrets-csv-turret-rotation-buff=Permet de définir des pourcentages de bonus personnalisés par rang pour la rotation de la tourelle. Affecte la vitesse à laquelle la tourelle peut pivoter vers une nouvelle cible avant d'attaquer. Doivent être des nombres numériques, chaque valeur séparée par une virgule. Les nombres doivent être au format 100. N'incluez pas de séparateurs ni de signes "%" dans les nombres. S'il y en a plus ou moins que le nombre de rangs actuel, la dernière valeur présente sera utilisée pour créer une répartition sur tous les rangs. (Il est recommandé de ne pas dépasser 80 comme pourcentage maximal. Des valeurs plus élevées peuvent rendre le jeu beaucoup trop facile, casser les tourelles ou casser votre partie. Personnalisez comme vous le souhaitez... Vous êtes prévenu || Valeur maximale : 999 ||)
heroturrets-max-health-on-rank=Points de vie au maximum lors d'une promotion
heroturrets-update-ammo-ranges=Règle la portée maximale des types de munitions sur la portée maximale des tourelles qui les utilisent. Cela peut corriger le fait que des roquettes et autres projectiles explosent avant d'atteindre leur cible sur des tourelles de rang plus élevé. À UTILISER À VOS RISQUES, EN DÉVELOPPEMENT
