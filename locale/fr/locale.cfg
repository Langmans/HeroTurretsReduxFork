[heroturrets]
page_heroturrets_text_1=Vos tourelles embarquent une IA auto-apprenante récupérée sur votre vaisseau. Plus elles combattent, plus elles deviennent mortelles : dès qu'une tourelle atteint assez d'éliminations (ou, en option, inflige assez de dégâts), elle se promeut automatiquement sur place, sans qu'il soit nécessaire de la reconstruire.
page_heroturrets_text_2=Utilisez les pages sur la gauche pour voir comment fonctionnent les rangs, ce que chaque rang apporte, ce qui se passe au moment d'une promotion, comment le fait de récupérer une tourelle affecte son rang, et quelles tourelles sont prises en charge.

menu_ranks=Rangs & Promotion
title_ranks=Rangs & Promotion
page_ranks_text_1=Chaque tourelle commence au rang 1 et peut, par défaut, gravir six rangs : 2e classe, Caporal, Sergent, Général, Maréchal, et Commandant suprême.
page_ranks_text_2=Par défaut, la promotion est basée sur les éliminations : 150 / 1 000 / 2 500 / 5 000 / 10 000 / 20 000 éliminations pour les rangs 1 à 6. Activer le paramètre "Rank by Damage" permet à une tourelle d'être également promue dès que ses dégâts totaux infligés dépassent le seuil d'un rang, ce qui aide les tourelles qui infligent de gros dégâts sans toujours porter le coup de grâce.
page_ranks_text_3=Les noms de rang, les seuils d'éliminations et les seuils de dégâts peuvent tous être personnalisés dans les paramètres du mod, ainsi qu'un modificateur global qui augmente ou réduit tous les seuils, et des multiplicateurs distincts pour les tourelles à munitions, à fluide, électriques et d'artillerie.

menu_bonuses=Bonus de rang
title_bonuses=Bonus de rang
page_bonuses_text_1=Chaque rang ajoute un bonus en pourcentage, passant par défaut d'environ 12% au premier rang à 60% au rang le plus élevé. Sauf si vous définissez des valeurs personnalisées, ce même pourcentage s'applique à la fois aux dégâts infligés, aux points de vie maximum, à la portée, à la cadence de tir, et à la vitesse de rotation/visée de la tourelle.
page_bonuses_text_2=Chacun de ces cinq bonus peut recevoir sa propre courbe personnalisée par rang dans les paramètres du mod, et un paramètre distinct "Rank Buff Modifier" augmente ou réduit chaque bonus globalement.

menu_rankup=Promotion
title_rankup=Promotion
page_rankup_text_1=Une promotion se produit instantanément, sur place, au moment où une élimination (ou des dégâts) d'une tourelle dépasse un seuil de rang. Il n'y a aucun temps d'arrêt et rien à reconstruire manuellement.
page_rankup_text_2=La tourelle est remplacée par sa version de rang supérieur, en conservant les munitions chargées, le fluide et l'énergie stockée, les points de vie actuels (sauf si "Set Health to Max on Rank Up" est activé), les compteurs d'éliminations/dégâts, la liste des cibles prioritaires, ainsi que toutes les connexions aux réseaux de circuits ou de logistique. Si les notifications de promotion sont activées dans vos paramètres personnels, vous verrez également un nom de rang flottant et un bref éclat de lumière au-dessus de la tourelle, ainsi qu'un son ou une alerte cliquable selon le mode de notification choisi.

menu_pickup=Récupérer des tourelles graduées
title_pickup=Récupérer des tourelles graduées
page_pickup_text_1=Ce qui arrive au rang d'une tourelle lorsque vous la minez dépend du paramètre "Kill Counter" :
page_pickup_text_2_heading=Fuzzy (par défaut)
page_pickup_text_2=La tourelle conserve son rang, mais son compteur d'éliminations est réinitialisé à la valeur minimale nécessaire pour ce rang plutôt qu'au nombre réel.
page_pickup_text_3=La tourelle conserve son compteur d'éliminations précis (et aussi les dégâts infligés, si "Retain Damage Counter" est également activé), stocké comme étiquette sur l'objet. Comme chaque objet peut porter un nombre exact différent, cela peut créer plusieurs piles distinctes dans votre inventaire au lieu d'une seule.
page_pickup_text_4=La tourelle perd entièrement son rang et redevient une simple tourelle de base une fois récupérée.
page_pickup_text_5_heading=Fantômes & Plans
page_pickup_text_5=Deux autres paramètres contrôlent le rang dans ces cas, tous deux désactivés par défaut : "Allow ranked ghosts" permet aux robots de construction de reconstruire une tourelle détruite à son rang d'origine plutôt qu'à partir de zéro, et "Allow ranked turrets in blueprints/copy-paste" conserve le rang d'une tourelle lorsqu'elle est incluse dans un plan ou copiée-collée. Avec les deux désactivés (par défaut), les tourelles reviennent à leur version de base dans les fantômes et les plans.

menu_compatibility=Compatibilité tourelles & mods
title_compatibility=Compatibilité tourelles & mods
page_compatibility_text_1=Types de tourelles prises en charge : à munitions, à fluide (ex. lance-flammes), électriques (ex. laser), et d'artillerie, aussi bien vanilla que la plupart des tourelles modées, y compris Space Age. Les tourelles d'artillerie ont leur propre interrupteur, car leur promotion ne peut pas utiliser le remplacement rapide du jeu ; désactiver ce paramètre après que certaines aient déjà été promues signifie que ces tourelles doivent être récupérées puis reposées pour revenir en arrière.
page_compatibility_text_2=Volontairement non graduées : tourelles à eau/vapeur, armes montées sur véhicule, dômes de bouclier, défenses anti-météorites de Space Age, et tourelles en mode créatif. Yuoki Turrets est pris en charge en tant que mod optionnel. Quelques autres mods de tourelles avec des problèmes de compatibilité connus sont volontairement ignorés jusqu'à ce qu'ils soient corrigés.

