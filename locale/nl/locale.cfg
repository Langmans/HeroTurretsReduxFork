[heroturrets]
menu_heroturrets=Hero Turrets
title_heroturrets=Hero Turrets
page_heroturrets_text_1=Je geschuttorens dragen geborgen, zelflerende AI van je schip met zich mee. Hoe meer ze vechten, hoe dodelijker ze worden: haal genoeg kills (of, optioneel, breng genoeg schade toe) en een toren promoveert zichzelf automatisch ter plekke, zonder dat je iets hoeft te herbouwen.
page_heroturrets_text_2=Gebruik de pagina's aan de linkerkant om te zien hoe rangen werken, wat elke rang je oplevert, wat er gebeurt op het moment van promotie, hoe het oppakken van torens hun rang beïnvloedt, en welke torens ondersteund worden.

menu_ranks=Rangen & Promotie
title_ranks=Rangen & Promotie
page_ranks_text_1=Elke toren begint op rang 1 en kan standaard door zes rangen klimmen: Soldaat 1e klasse, Korporaal, Sergeant, Generaal, Veldmaarschalk, en Opperbevelhebber.
page_ranks_text_2=Standaard is promotie gebaseerd op kills: 150 / 1.000 / 2.500 / 5.000 / 10.000 / 20.000 kills voor rang 1 tot en met 6. Door de instelling "Rank by Damage" aan te zetten kan een toren ook promoveren zodra zijn totale toegebrachte schade een rang-drempel overschrijdt, wat helpt bij torens die zware schade toebrengen zonder altijd de genadeklap uit te delen.
page_ranks_text_3=Rangnamen, kill-drempels en schade-drempels zijn allemaal aan te passen in de mod-instellingen, samen met een globale modifier die elke drempel omhoog of omlaag schaalt, en aparte vermenigvuldigers voor munitie-, vloeistof-, elektrische en artillerietorens.

menu_bonuses=Rangbonussen
title_bonuses=Rangbonussen
page_bonuses_text_1=Elke rang voegt een percentage-bonus toe, standaard oplopend van ongeveer 12% bij de eerste rang tot 60% bij de hoogste rang. Tenzij je eigen waarden instelt, geldt datzelfde percentage tegelijk voor toegebrachte schade, maximale gezondheid, bereik, vuursnelheid, en rotatie-/richtsnelheid van de toren.
page_bonuses_text_2=Elk van deze vijf bonussen kan een eigen aangepaste curve per rang krijgen in de mod-instellingen, en een aparte instelling "Rank Buff Modifier" schaalt elke bonus globaal omhoog of omlaag.

menu_rankup=Promoveren
title_rankup=Promoveren
page_rankup_text_1=Een promotie gebeurt direct, ter plekke, op het moment dat een kill (of schade) van een toren een rang-drempel overschrijdt. Er is geen downtime en niets om handmatig te herbouwen.
page_rankup_text_2=De toren wordt vervangen door zijn hogere-rang-versie, waarbij geladen munitie, vloeistof en opgeslagen energie, huidige gezondheid (tenzij "Set Health to Max on Rank Up" is ingeschakeld), kill-/schadetellingen, de prioriteitendoellijst, en eventuele circuit- of logistieke netwerkverbindingen behouden blijven. Als promotiemeldingen aanstaan in je persoonlijke instellingen, zie je ook een zwevende rangnaam en een korte lichtflits boven de toren, plus een geluid of een aanklikbare melding, afhankelijk van je gekozen meldingsmodus.

menu_pickup=Rangtorens Oppakken
title_pickup=Rangtorens Oppakken
page_pickup_text_1=Wat er met de rang van een toren gebeurt wanneer je hem opraapt, hangt af van de instelling "Kill Counter":
page_pickup_text_2_heading=Fuzzy (standaard)
page_pickup_text_2=De toren behoudt zijn rang, maar zijn killtelling wordt teruggezet naar precies genoeg om die rang te rechtvaardigen, in plaats van het werkelijke aantal.
page_pickup_text_3_heading=Exact
page_pickup_text_3=De toren behoudt zijn precieze killtelling (en ook de toegebrachte schade, als "Retain Damage Counter" ook aanstaat), opgeslagen als een tag op het item. Omdat elk item een ander exact aantal kan dragen, kan dit leiden tot meerdere aparte stapels in je inventaris in plaats van één.
page_pickup_text_4_heading=Disable
page_pickup_text_4=De toren verliest zijn rang volledig en wordt bij het oprapen een gewone basistoren.
page_pickup_text_5_heading=Ghosts & Blueprints
page_pickup_text_5=Nog twee instellingen bepalen de rang in deze gevallen, beide standaard uitgeschakeld: "Allow ranked ghosts" laat bouwrobots een vernietigde toren op zijn oorspronkelijke rang herbouwen in plaats van vanaf nul, en "Allow ranked turrets in blueprints/copy-paste" behoudt de rang van een toren wanneer die geblauwdrukt of gekopieerd-geplakt wordt. Met beide uit (de standaard) vallen torens in ghosts en blueprints terug op hun gewone basisversie.

menu_compatibility=Toren- & Mod-compatibiliteit
title_compatibility=Toren- & Mod-compatibiliteit
page_compatibility_text_1=Ondersteunde torentypes: munitie-, vloeistof- (bv. vlammenwerper), elektrische (bv. laser), en artillerietorens, zowel standaard als de meeste gemodde torens, inclusief Space Age. Artillerietorens hebben hun eigen aan/uit-schakelaar, omdat promotie bij hen geen gebruik kan maken van de fast-replace van het spel; die instelling later uitzetten terwijl sommige al gepromoveerd zijn, betekent dat die torens opnieuw opgepakt en neergezet moeten worden om terug te veranderen.
page_compatibility_text_2=Bewust niet gerangschikt: water-/stoomtorens, voertuig-gemonteerde wapens, schildkoepels, meteoorverdediging uit Space Age, en creative-mode-torens. Yuoki Turrets wordt ondersteund als optionele mod. Een paar andere torenmods met bekende compatibiliteitsproblemen worden bewust overgeslagen totdat ze verholpen zijn.

