[mod-setting-description]
heroturrets-hide-ranked-from-ghost-cursor=Voorkomt dat gerangschikte torens verschijnen in het ghost-cursor-selectiepaneel bij gebruik van remote view/radar. Gerangschikte torens upgraden nog steeds automatisch op basis van kills/schade. (Standaard: Ingeschakeld)
heroturrets-setting-level-up-modifier=Vermenigvuldigt het standaard aantal benodigde kills/schade per rang. Formule is #Nodig = #VoorRang + (#VoorRang * Modifier / 10). Kill-/schaderangwaarden zijn te vinden op de modpagina. (Standaard is 0)
heroturrets-setting-level-buff-modifier=Verandert de bonussen per rang als percentage. (Een waarde van 1 is een toename van 1%, 10 een toename van 10%, enz.) (Standaard is 0, maximaal 100)
heroturrets-kill-counter=Bepaalt hoe torens behandeld worden bij demontage. Fuzzy: behoudt het aantal kills dat voor de rang vereist is wanneer de toren wordt opgeraapt. | Exact: houdt de exacte kills van de toren bij bij het oprapen. Exact zorgt ervoor dat torens tags krijgen, wat kan resulteren in veel stapels in je inventaris omdat elke stapel een ander aantal kills bijhoudt. | Disabled: torens behouden hun rang niet bij demontage, hun kills worden geregistreerd als "0". Ze vallen terug op de basistoren.
heroturrets-allow-artillery-turrets=Schakel promotie voor artillerietorens uit. Indien uitgeschakeld moeten alle gerangschikte artillerietorens opgeraapt en opnieuw neergezet worden.
heroturrets-setting-ammo-turret-kill-multiplier=Voegt een vermenigvuldigende hoeveelheid kills/schade toe die nodig is per rang voor torens van het type "ammo-turret". Formule is (de variabele #Nodig komt uit de Rangmodifier-formule): #TotaalNodig = #Nodig * Modifier. (Min: 1, Max: 20)
heroturrets-setting-fluid-turret-kill-multiplier=Voegt een vermenigvuldigende hoeveelheid kills/schade toe die nodig is per rang voor torens van het type "fluid-turret". Formule is (de variabele #Nodig komt uit de Rangmodifier-formule): #TotaalNodig = #Nodig * Modifier. (Min: 1, Max: 20)
heroturrets-setting-electric-turret-kill-multiplier=Voegt een vermenigvuldigende hoeveelheid kills/schade toe die nodig is per rang voor torens van het type "electric-turret". Formule is (de variabele #Nodig komt uit de Rangmodifier-formule): #TotaalNodig = #Nodig * Modifier. (Min: 1, Max: 20)
heroturrets-setting-artillery-turret-kill-multiplier=Voegt een vermenigvuldigende hoeveelheid kills/schade toe die nodig is per rang voor torens van het type "artillery-turret". Formule is (de variabele #Nodig komt uit de Rangmodifier-formule): #TotaalNodig = #Nodig * Modifier. (Min: 1, Max: 20)
heroturrets-allow-damage=Staat promotie toe op basis van door de toren toegebrachte schade
heroturrets-use-csv=Schakelt aangepaste namen in of uit
heroturrets-csv-names=Hiermee kun je eigen rangnamen definiëren, gescheiden door komma's. De bonussen worden verspreid over de beschikbare opties. Niet aan te raden om te wijzigen nadat een spel gestart is. Maximaal 12 namen, elk maximaal 25 tekens lang.
heroturrets-damage-counter=Behoudt schadestatistieken. Werkt alleen als Killteller op Exact staat.
heroturrets-allow-ghost-rank=Zorgt ervoor dat vernietigde entiteiten een gerangschikte entiteit-ghost verwachten als vervanging, anders wordt de basisentiteit-ghost geplaatst
heroturrets-allow-blueprint-rank=Indien uitgeschakeld worden gerangschikte torens in blueprints en kopiëren-plakken vervangen door basistorens. Indien ingeschakeld blijven gerangschikte torens behouden in blueprints. (Standaard: Uitgeschakeld)
heroturrets-announce-rank-up=Indien ingeschakeld word je op de hoogte gesteld van torenpromoties. (Standaard: Ingeschakeld)
heroturrets-announce-rank-up-mode=Kies of de melding een globale melding is of alleen een lokaal torengeluid. Werkt alleen als promotiemeldingen ingeschakeld zijn. (Standaard: Lokaal)
heroturrets-announce-rank-up-sound=Speel een geluid af wanneer een toren promoveert. Werkt alleen als promotiemeldingen ingeschakeld zijn. (Standaard: Ingeschakeld)
heroturrets-announce-rank-up-flash=Toont een visuele flitstekst wanneer een toren promoveert. Werkt alleen als promotiemeldingen ingeschakeld zijn. (Standaard: Ingeschakeld)
heroturrets-setting-run-in-updates=Torens worden standaard gegenereerd in final fixes, maar je kunt dit veranderen zodat torens gegenereerd worden in data updates. Aanbevolen voor de SearchLightAssault-mod
heroturrets-use-csv-kills=Schakelt aangepaste kill-waarden in of uit.
heroturrets-csv-kill= Hiermee kun je aangepaste kill-rangwaarden instellen. Moeten numerieke getallen zijn, elke waarde gescheiden door een komma. Getallen moeten in het formaat 10000 staan. Gebruik geen scheidingstekens in de getallen. Maximaal getal is 4000000 (4 miljoen). Het aantal waarden moet gelijk zijn aan het aantal beschikbare rangen. Standaard is dat zes, maar als je ook Aangepaste rangen gebruikt, moet het aantal overeenkomen met het aantal namen dat je daar hebt. Is het meer of minder dan het huidige aantal rangen, dan worden de eerste en laatste aanwezige waarden gebruikt om een verdeling over alle rangen te maken.
heroturrets-use-csv-damage=Schakelt aangepaste schade-rangwaarden in. Wordt alleen gebruikt als "Rang op basis van schade" ook is ingeschakeld
heroturrets-csv-damage= Hiermee kun je aangepaste schade-rangwaarden instellen. Wordt alleen gebruikt als "Rang op basis van schade" ook is ingeschakeld. Moeten numerieke getallen zijn, elke waarde gescheiden door een komma. Getallen moeten in het formaat 10000 staan. Gebruik geen scheidingstekens in de getallen. Het aantal waarden moet gelijk zijn aan het aantal beschikbare rangen. Standaard is dat zes, maar als je ook Aangepaste rangen gebruikt, moet het aantal overeenkomen met het aantal namen dat je daar hebt. Is het meer of minder dan het huidige aantal rangen, dan worden de eerste en laatste aanwezige waarden gebruikt om een verdeling over alle rangen te maken.
heroturrets-use-csv-buff= Schakel aangepast bonuspercentage voor rangen in
heroturrets-csv-buff= Hiermee kun je aangepaste bonuspercentages per rang instellen. Moeten numerieke getallen zijn, elke waarde gescheiden door een komma. Getallen moeten in het formaat 100 staan. Gebruik geen scheidingstekens of "%"-tekens in de getallen. Is het meer of minder dan het huidige aantal rangen, dan wordt de laatste aanwezige waarde gebruikt om een verdeling over alle rangen te maken. (Aanbevolen om niet boven 80 te gaan als hoogste percentage. Hogere waarden kunnen het spel veel te makkelijk maken, torens breken of je spel breken. Je bent gewaarschuwd || Maximale waarde: 999 ||)
heroturrets-use-csv-health-buff= Schakel aangepast maximale-gezondheidspercentage voor rangen in, standaard gelijk aan het algemene bonuspercentage
heroturrets-csv-health-buff= Hiermee kun je aangepaste bonuspercentages per rang instellen voor maximale gezondheid. Moeten numerieke getallen zijn, elke waarde gescheiden door een komma. Getallen moeten in het formaat 100 staan. Gebruik geen scheidingstekens of "%"-tekens in de getallen. Is het meer of minder dan het huidige aantal rangen, dan wordt de laatste aanwezige waarde gebruikt om een verdeling over alle rangen te maken. (Aanbevolen om niet boven 80 te gaan als hoogste percentage. Hogere waarden kunnen het spel veel te makkelijk maken, torens breken of je spel breken. Je past het aan zoals je wilt... Je bent gewaarschuwd || Maximale waarde: 999 ||)
heroturrets-use-csv-range-buff= Schakel aangepast bereikpercentage voor rangen in, standaard gelijk aan het algemene bonuspercentage
heroturrets-csv-range-buff= Hiermee kun je aangepaste bonuspercentages per rang instellen voor bereik. Moeten numerieke getallen zijn, elke waarde gescheiden door een komma. Getallen moeten in het formaat 100 staan. Gebruik geen scheidingstekens of "%"-tekens in de getallen. Is het meer of minder dan het huidige aantal rangen, dan wordt de laatste aanwezige waarde gebruikt om een verdeling over alle rangen te maken. (Aanbevolen om niet boven 80 te gaan als hoogste percentage. Hogere waarden kunnen het spel veel te makkelijk maken, torens breken of je spel breken. Je past het aan zoals je wilt... Je bent gewaarschuwd || Maximale waarde: 999 ||)
heroturrets-use-csv-firerate-buff= Schakel aangepast afkoeltijdpercentage voor rangen in, standaard gelijk aan het algemene bonuspercentage
heroturrets-csv-firerate-buff= Hiermee kun je aangepaste bonuspercentages per rang instellen voor afkoeltijd. Moeten numerieke getallen zijn, elke waarde gescheiden door een komma. Getallen moeten in het formaat 100 staan. Gebruik geen scheidingstekens of "%"-tekens in de getallen. Is het meer of minder dan het huidige aantal rangen, dan wordt de laatste aanwezige waarde gebruikt om een verdeling over alle rangen te maken. (Aanbevolen om niet boven 80 te gaan als hoogste percentage. Hogere waarden kunnen het spel veel te makkelijk maken, torens breken of je spel breken. Je past het aan zoals je wilt... Je bent gewaarschuwd || Maximale waarde: 999 ||)
heroturrets-use-csv-attack-speed-buff= Schakel aangepast aanvalssnelheidspercentage voor rangen in, standaard gelijk aan het algemene bonuspercentage
heroturrets-csv-attack-speed-buff= Hiermee kun je aangepaste bonuspercentages per rang instellen voor aanvalssnelheid. Beïnvloedt hoe snel de aanvals- en voorbereidingsanimaties worden uitgevoerd. Moeten numerieke getallen zijn, elke waarde gescheiden door een komma. Getallen moeten in het formaat 100 staan. Gebruik geen scheidingstekens of "%"-tekens in de getallen. Is het meer of minder dan het huidige aantal rangen, dan wordt de laatste aanwezige waarde gebruikt om een verdeling over alle rangen te maken. (Aanbevolen om niet boven 80 te gaan als hoogste percentage. Hogere waarden kunnen het spel veel te makkelijk maken, torens breken of je spel breken. Je past het aan zoals je wilt... Je bent gewaarschuwd || Maximale waarde: 999 ||)
heroturrets-use-csv-turret-rotation-buff= Schakel aangepast rotatiesnelheidspercentage voor rangen in, standaard gelijk aan het algemene bonuspercentage
heroturrets-csv-turret-rotation-buff=Hiermee kun je aangepaste bonuspercentages per rang instellen voor torenrotatie. Beïnvloedt hoe snel de toren naar een nieuw doelwit kan draaien voordat hij aanvalt. Moeten numerieke getallen zijn, elke waarde gescheiden door een komma. Getallen moeten in het formaat 100 staan. Gebruik geen scheidingstekens of "%"-tekens in de getallen. Is het meer of minder dan het huidige aantal rangen, dan wordt de laatste aanwezige waarde gebruikt om een verdeling over alle rangen te maken. (Aanbevolen om niet boven 80 te gaan als hoogste percentage. Hogere waarden kunnen het spel veel te makkelijk maken, torens breken of je spel breken. Je past het aan zoals je wilt... Je bent gewaarschuwd || Maximale waarde: 999 ||)
heroturrets-max-health-on-rank=Zet gezondheid op maximum bij promotie
heroturrets-update-ammo-ranges=Stelt het maximale bereik van munitietypes in op het maximale bereik van de torens die ze gebruiken. Dit kan een probleem verhelpen waarbij raketten en andere projectielen ontploffen voordat ze hun doelwit bereiken bij hoger gerangschikte torens. GEBRUIK OP EIGEN RISICO, IS IN ONTWIKKELING

