HeroTurretsReduxFork=Torens worden gebouwd met geborgen, zelflerende AI-technologie van je schip waardoor ze dodelijker worden met de praktijk. Breidt torens uit met een rangsysteem gebaseerd op kills. Werkt voor gegenereerde torens, dus niet beperkt tot standaardtorens, herkenbaar aan het overlay-rangteken. Rang geeft bonussen aan individuele torens.

